<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSボックス</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f6fa;
        }

        /* ヘッダー */
        .header {
            background: white;
            padding: 10px 15px;
            border-bottom: 3px solid red;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            color: red;
            font-size: 18px;
        }

        .menu {
            font-size: 20px;
        }

        /* コンテナ */
        .container {
            padding: 15px;
        }

        /* ヒーロー */
        .hero {
            background: #2f5d50;
            color: white;
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
        }

        .btn-main {
            background: red;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
        }

        .btn-sub {
            border: 1px solid white;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
        }

        /* グリッド */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .grid-item {
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
        }

        .red { background: #fdeaea; color: red; }
        .orange { background: #fff3e0; color: orange; }
        .green { background: #e8f5e9; color: green; }
        .blue { background: #e3f2fd; color: blue; }

        /* セクション */
        .section {
            margin-top: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .more {
            color: red;
            text-decoration: none;
        }

        .empty-box {
            text-align: center;
            padding: 30px;
            color: gray;
        }

        .footer {
            background: #300;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* PC対応 */
        @media (min-width: 768px) {
            .container {
                max-width: 900px;
                margin: 0 auto;
            }

            .hero h1 {
                font-size: 40px;
            }

            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="header">
    <div class="logo">
        <a href="{% url 'index' %}">SSボックス</a>
    </div>
    <div class="menu">☰</div>
</div>

{% block content %}
{% endblock %}

<div class="footer">
    <h3>SSボックス</h3>
    <p>佐賀商業高校 生徒向け掲示板</p>
</div>

</body>
</html>
