<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSボックス</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f5f6fa;
        }

        /* ヘッダー */
        .header {
            background: white;
            padding: 10px 15px;
            border-bottom: 3px solid red;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            color: red;
            font-size: 18px;
        }

        .logo a {
            color: red;
            text-decoration: none;
        }

        .menu {
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }

        /* 右側から出てくるメニュー（ドロワー） */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 100;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            height: 100%;
            width: 260px;
            max-width: 80%;
            background: white;
            box-shadow: -4px 0 20px rgba(0, 0, 0, 0.2);
            transform: translateX(100%);
            transition: transform 0.25s ease;
            z-index: 101;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }

        .drawer-close {
            background: none;
            border: none;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            color: #333;
        }

        .drawer-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }

        .drawer-nav a {
            padding: 12px 8px;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
        }

        .drawer-nav a:hover {
            background: #f5f6fa;
        }

        .drawer-logout-form {
            border-top: 1px solid #eee;
            padding-top: 12px;
        }

        .drawer-logout-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: red;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .drawer-logout-btn:hover {
            background: #c40000;
        }

        body.drawer-locked {
            overflow: hidden;
        }

        /* コンテナ */
        .container {
            padding: 15px;
        }

        /* ヒーロー */
        .hero {
            background: #2f5d50;
            color: white;
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
        }

        .hero h1 {
            font-size: 32px;
        }

        .btn-main {
            background: red;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
        }

        .btn-sub {
            border: 1px solid white;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
        }
        
        .btn-outline {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            border: 2px solid #2f5d50;
            color: #2f5d50;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn-outline:hover {
            background: #2f5d50;
            color: white;
        }

        /* グリッド */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .grid-item {
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
        }

        .red { background: #fdeaea; color: red; }
        .orange { background: #fff3e0; color: orange; }
        .green { background: #e8f5e9; color: green; }
        .blue { background: #e3f2fd; color: blue; }

        /* セクション */
        .section {
            margin-top: 30px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .more {
            color: red;
            text-decoration: none;
        }

        .empty-box {
            text-align: center;
            padding: 30px;
            color: gray;
        }

        .footer {
            background: #300;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        /* PC対応 */
        @media (min-width: 768px) {
            .container {
                max-width: 900px;
                margin: 0 auto;
            }

            .hero h1 {
                font-size: 40px;
            }

            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="header">
    <div class="logo">
        <a href="{% url 'index' %}">SSボックス</a>
    </div>
    <div class="menu" id="menuBtn" role="button" tabindex="0" aria-label="メニューを開く">☰</div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-header">
        <span>メニュー</span>
        <button class="drawer-close" id="drawerClose" aria-label="閉じる">×</button>
    </div>

    <nav class="drawer-nav">
        <a href="{% url 'index' %}">ホーム</a>
        <a href="{% url 'post_opinion' %}">意見を投稿する</a>
        <a href="{% url 'opinion_list' %}">意見箱を見る</a>
        <a href="{% url 'post_lesson_question' %}">授業に質問する</a>
        <a href="{% url 'lesson_question_list' %}">質問一覧を見る</a>
        <a href="{% url 'survey_list' %}">アンケート</a>
        <a href="{% url 'change_student_password' %}">パスワード変更</a>
    </nav>

    <form method="POST" action="{% url 'logout_student' %}" class="drawer-logout-form">
        {% csrf_token %}
        <button type="submit" class="drawer-logout-btn">ログアウト</button>
    </form>
</aside>

{% block content %}
{% endblock %}

<div class="footer">
    <h3>SSボックス</h3>
    <p>佐賀商業高校 生徒向け掲示板</p>
</div>

<script>
(function () {
    var menuBtn = document.getElementById('menuBtn');
    var drawer = document.getElementById('drawer');
    var overlay = document.getElementById('drawerOverlay');
    var closeBtn = document.getElementById('drawerClose');

    function openDrawer() {
        drawer.classList.add('open');
        overlay.classList.add('open');
        drawer.setAttribute('aria-hidden', 'false');
        document.body.classList.add('drawer-locked');
    }

    function closeDrawer() {
        drawer.classList.remove('open');
        overlay.classList.remove('open');
        drawer.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('drawer-locked');
    }

    menuBtn.addEventListener('click', openDrawer);

    menuBtn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openDrawer();
        }
    });

    closeBtn.addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeDrawer();
        }
    });
})();
</script>

</body>
</html>
