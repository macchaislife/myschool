{% extends "home/base.html" %}
{% block content %}

<h2>{{ question.title }}</h2>
<p>{{ question.content }}</p>

{% if question.answer %}
    <hr>
    <h3>先生の回答</h3>
    <p>{{ question.answer }}</p>
{% else %}
    <p><em>まだ先生の回答はありません。</em></p>
{% endif %}

<details style="margin-top:15px;">
    <summary style="cursor:pointer; color:#c0392b; font-size:14px;">🚨 この質問を通報する</summary>

    <form method="post" action="{% url 'report_content' 'lesson_question' question.id %}" style="margin-top:10px;">
        {% csrf_token %}

        <select name="reason" style="padding:8px; border-radius:6px; border:1px solid #ccc;">
            <option value="troll">荒らし・嫌がらせ</option>
            <option value="abuse">誹謗中傷</option>
            <option value="spam">スパム・宣伝</option>
            <option value="other">その他</option>
        </select>

        <br><br>

        <input
            type="text"
            name="detail"
            placeholder="詳細（任意）"
            style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;"
        >

        <br><br>

        <button
            type="submit"
            style="background:#c0392b; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer;"
        >
            通報を送信する
        </button>
    </form>
</details>

{% endblock %}
