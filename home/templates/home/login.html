{% extends "home/base.html" %}
{% load static %}

{% block title %}生徒認証{% endblock %}

{% block content %}

<style>
    body {
        background: linear-gradient(180deg, #0f0f0f, #1a1a1a);
    }

    .login-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
    }

    .login-card {
        background: #2b2b2b;
        padding: 40px 30px;
        border-radius: 20px;
        width: 90%;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        text-align: center;
    }

    .login-card h1 {
        color: white;
        margin-bottom: 30px;
        font-size: 24px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    label {
        color: #ccc;
        font-size: 14px;
        display: block;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #3a3a3a;
        color: white;
        font-size: 14px;
    }

    .login-btn {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: #e0e0e0;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    .login-btn:hover {
        background: white;
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h1>生徒認証</h1>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>生徒コード</label>
                <input type="text" name="student_code" placeholder="生徒コードを入力">
            </div>

            <button type="submit" class="login-btn">続ける</button>
        </form>
    </div>
</div>

{% endblock %}
