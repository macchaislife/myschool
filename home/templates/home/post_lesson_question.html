{% extends "home/base.html" %}
{% block content %}

<style>
.page-wrap{
    background:#f8f5f5;
    min-height:100vh;
    padding:30px 15px;
}

.question-card{
    max-width:800px;
    margin:auto;
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    border:1px solid #eee;
}

.question-header{
    padding:40px 30px;
    border-bottom:1px solid #f0dede;
    display:flex;
    align-items:flex-start;
    gap:20px;
}

.icon-circle{
    width:80px;
    height:80px;
    border-radius:50%;
    background:#ff6b00;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:34px;
    flex-shrink:0;
}

.question-header h1{
    margin:0;
    font-size:48px;
    font-weight:700;
}

.question-header p{
    margin-top:10px;
    color:#8a7b7b;
    font-size:28px;
}

.form-area{
    padding:35px 25px 45px;
}

.info-box{
    background:#fff8ef;
    border:2px solid #f5d1a5;
    border-radius:18px;
    padding:22px;
    margin-bottom:35px;
}

.info-box h3{
    margin:0 0 12px;
    color:#d95f00;
    font-size:34px;
}

.info-box p{
    margin:0;
    color:#cc5d1d;
    line-height:1.8;
    font-size:25px;
}

.form-group{
    margin-bottom:35px;
}

.form-group label{
    display:block;
    margin-bottom:12px;
    font-size:32px;
    font-weight:700;
}

.required{
    color:#d40000;
}

.input-box,
.textarea-box{
    width:100%;
    padding:20px;
    border:2px solid #eadede;
    border-radius:16px;
    font-size:28px;
    box-sizing:border-box;
    background:white;
}

.textarea-box{
    min-height:180px;
    resize:none;
}

.counter{
    text-align:right;
    margin-top:8px;
    color:#9c8d8d;
    font-size:22px;
}

.anonymous-box{
    background:#fff3f3;
    border-radius:18px;
    padding:24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.anonymous-text h4{
    margin:0;
    font-size:34px;
}

.anonymous-text p{
    margin:8px 0 0;
    color:#8f7f7f;
    font-size:24px;
}

.toggle{
    transform:scale(2);
}

.button-row{
    display:flex;
    gap:20px;
}

.back-btn,
.submit-btn{
    flex:1;
    padding:22px;
    border-radius:16px;
    font-size:30px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
    border:none;
}

.back-btn{
    background:white;
    border:2px solid #ddd;
}

.submit-btn{
    background:#ff6b00;
    color:white;
}

@media(max-width:768px){

    .question-header h1{
        font-size:28px;
    }

    .question-header p{
        font-size:18px;
    }

    .icon-circle{
        width:60px;
        height:60px;
        font-size:25px;
    }

    .form-group label{
        font-size:24px;
    }

    .input-box,
    .textarea-box{
        font-size:18px;
    }

    .anonymous-text h4{
        font-size:24px;
    }

    .anonymous-text p{
        font-size:16px;
    }

    .submit-btn,
    .back-btn{
        font-size:22px;
    }

    .info-box h3{
        font-size:24px;
    }

    .info-box p{
        font-size:18px;
    }
}
</style>

<div class="page-wrap">

    <div class="question-card">

        <div class="question-header">
            <div class="icon-circle">📥</div>

            <div>
                <h1>意見箱に投稿する</h1>
                <p>学校への質問・聞きたいことを投稿しましょう</p>
            </div>
        </div>

        <div class="form-area">

            <div class="info-box">
                <h3>📬 意見箱とは？</h3>

                <p>
                    学校に聞きたいことや、みんなで共有したい疑問を投稿できます。<br>
                    管理者が確認して回答します。
                </p>
            </div>

            <form method="post">

                {% csrf_token %}

                <div class="form-group">
                    <label>
                        タイトル
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="title"
                        maxlength="200"
                        required
                        class="input-box"
                        placeholder="質問のタイトルを入力してください"
                    >

                    <div class="counter">0/200</div>
                </div>

                <div class="form-group">
                    <label>
                        内容
                        <span class="required">*</span>
                    </label>

                    <textarea
                        name="content"
                        required
                        class="textarea-box"
                        placeholder="質問の詳細を入力してください。具体的に書くほど回答しやすくなります。"
                    ></textarea>
                </div>

                <div class="anonymous-box">

                    <div class="anonymous-text">
                        <h4>匿名で投稿する</h4>
                        <p>オンにすると名前が表示されません</p>
                    </div>

                    <input
                        type="checkbox"
                        name="anonymous"
                        class="toggle"
                        checked
                    >
                </div>

                <div class="button-row">

                    <button
                        type="button"
                        class="back-btn"
                        onclick="history.back()"
                    >
                        ← 戻る
                    </button>

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        📥 投稿する
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
