{% extends "home/base.html" %}
{% block content %}

<div class="container">

    <h2 class="title">アンケート一覧</h2>

    {% if surveys %}
    <div class="card-list">
        {% for survey in surveys %}
        <div class="card">
            <a href="{% url 'survey_detail' survey.id %}" class="card-title">
                {{ survey.title }}
            </a>

            <p class="date">{{ survey.created_at }}</p>

            {% if user.is_staff %}
            <a href="{% url 'survey_results' survey.id %}" class="result-btn">
                結果を見る
            </a>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    {% else %}
    <p class="empty">公開中のアンケートはありません。</p>
    {% endif %}

</div>

{% endblock %}
