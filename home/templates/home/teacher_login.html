{% extends "home/base.html" %}

{% block content %}

<div style="max-width:500px; margin:60px auto; padding:30px; background:white; border-radius:20px; box-shadow:0 4px 15px rgba(0,0,0,0.1);">

    <h1 style="text-align:center; margin-bottom:30px;">
        先生ログイン
    </h1>

    <form method="post">

        {% csrf_token %}

        <label>ユーザー名</label><br>
        <input
            type="text"
            name="username"
            style="
                width:100%;
                padding:12px;
                margin-top:8px;
                margin-bottom:20px;
                border-radius:10px;
                border:1px solid #ccc;
            "
        >

        <label>パスワード</label><br>
        <input
            type="password"
            name="password"
            style="
                width:100%;
                padding:12px;
                margin-top:8px;
                margin-bottom:25px;
                border-radius:10px;
                border:1px solid #ccc;
            "
        >

        <button
            type="submit"
            style="
                width:100%;
                padding:14px;
                background:#d60000;
                color:white;
                border:none;
                border-radius:10px;
                font-size:18px;
                font-weight:bold;
                cursor:pointer;
            "
        >
            ログイン
        </button>

    </form>

</div>

{% endblock %}
